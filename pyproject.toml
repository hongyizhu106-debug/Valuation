[project]
name = "valuation-dashboard"
version = "0.1.0"
description = "Local SEC filing dashboard and transparent valuation helpers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Valuation Project" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[tool.pytest.ini_options]
testpaths = ["examples"]
